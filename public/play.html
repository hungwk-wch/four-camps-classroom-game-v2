<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>加入遊戲｜四陣營課堂競技平台</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="joinView" class="shell"><div class="topbar"><div class="brand"><div class="brand-mark">玩</div><div><h1>加入四陣營競技</h1><p>輸入資料後等待老師開始</p></div></div></div><div class="card" style="max-width:760px;margin:0 auto">
<div class="field"><label>6 位房間碼</label><input id="roomCode" inputmode="text" autocapitalize="characters" maxlength="6" style="font-size:28px;text-transform:uppercase;letter-spacing:5px;text-align:center"></div>
<div class="field"><label>姓名</label><input id="name" maxlength="18" placeholder="例如：4A 陳小明"></div>
<label>選擇陣營</label><div id="teamChoices" class="team-grid"></div><div style="height:16px"></div><button id="joinBtn" class="btn accent" style="width:100%;font-size:20px">加入遊戲</button><p id="joinMsg" class="error"></p></div></div>
<div id="lobbyView" class="shell hidden"><div class="card" style="max-width:850px;margin:20px auto;text-align:center"><h2>已加入房間 <span id="lobbyCode" style="color:var(--gold)"></span></h2><p class="muted">等待老師開始。你仍可在開始前更換陣營。</p><div id="lobbyTeams" class="team-grid"></div><div style="height:16px"></div><div id="myLobby" class="pill"></div></div></div>
<div id="gameView" class="game-shell hidden"><div class="game-top"><span id="roundLabel" class="pill">1/1</span><div id="gameQuestion" class="question">準備</div><div id="timer" class="timer">12</div></div><div id="arena" class="arena"><div class="crosshair"></div></div><div class="game-bottom"><div class="me"><img id="myTeamImg"><div><div id="myName"></div><div><span id="myScore" class="score">0</span> 分　<span id="myCombo" class="combo"></span></div></div></div><div id="teamScore" class="pill">陣營 0</div></div></div>
<div id="overlay" class="overlay hidden"><div class="overlay-box"><div id="overlayMain"></div></div></div><div id="flash" class="flash"></div>
<script src="/socket.io/socket.io.js"></script><script src="play.js"></script></body></html>
